# Partitioned disk: 64 MiB ext2 boot partition with /Image, 128 MiB ext4 root.
image rv-emu-rs-disk.img {
    hdimage {
        partition-table-type = "dos"
        align = 1M
    }

    partition boot {
        image = "boot.ext2"
        size = 64M
        partition-type = 0x83
        bootable = "true"
    }

    partition root {
        image = "rootfs.ext4"
        partition-type = 0x83
    }
}
