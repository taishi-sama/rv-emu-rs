[package]
name = "rv-emu-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["plus_FD"]
# Checks correspondance of CPU and MMU states
mmu-context-check = []
# Floating point support (F and D extensions)
plus_FD = ["dep:softfloat_pure"]

[profile.release]
debug = "line-tables-only"

[profile.maxspeed]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gdbstub = "0.6.6"
gdbstub_arch = "0.2.4"
pollster = "1.0.1"
rb = "0.4.1"
rodio = "0.19.0"
softfloat_pure = { git = "https://github.com/HarryR/softfloat-pure.git", rev = "f655f4c3119f6e8b05cf4790df705c6e54520611", optional = true }
wgpu = "30.0.2"
winit = "0.30.13"
